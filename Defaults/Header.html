<header class="site-header">
    <div class="top-header">
        <a class="brand" href="dashboard.html" aria-label="ShopZone home">
            <span class="brand-mark">S</span>
            <span>ShopZone</span>
        </a>

        <form class="search" role="search">
            <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/>
            </svg>
            <input type="search" placeholder="Search products..." aria-label="Search products" />
            <button type="submit">Search</button>
        </form>

        <nav class="header-actions" aria-label="Account links">
            <div class="account-menu">
                <button class="account-toggle" type="button" aria-haspopup="menu" aria-expanded="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0m12-13a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg>
                    <span>Account</span>
                    <svg class="account-chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
                </button>
                <div class="account-dropdown" role="menu" aria-label="Account options">
                    <a href="/account" role="menuitem">
                        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0m12-13a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg>
                        <span>My account</span>
                    </a>
                    <a href="login.html" role="menuitem" class="logout-link">
                        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5m5 5H3m12 9h4a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-4"/></svg>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
            <a href="/orders">Orders</a>
            <a class="cart-link" href="cart.html" aria-label="Shopping cart">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L20.6 7H6m3 13h.01M18 20h.01"/></svg>
                <span class="cart-count">0</span>
            </a>
        </nav>
    </div>

    <nav class="category-nav" aria-label="Product categories">
        <a href="/categories">Categories</a>
        <a href="/offers">Offers</a>
        <a href="/electronics">Electronics</a>
        <a href="/fashion">Fashion</a>
        <a href="list-product.html">Sell a product</a>
        <a href="edit-product.html">Manage product</a>
    </nav>
</header>
